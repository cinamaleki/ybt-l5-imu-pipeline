[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ybt-l5-imu-pipeline"
version = "0.2.0"
description = "Exploratory lumbar-IMU Y-Balance pipeline with explicit boundary provenance and participant-held-out evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Sina Maleki"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "openpyxl>=3.1,<4", "reportlab>=4.1,<5"]

[project.scripts]
ybt-l5 = "ybt_l5_cli:main"

[tool.setuptools]
py-modules = ["ybt_feature_audit", "ybt_feature_report", "ybt_l5_cli", "ybt_synthetic", "run_complete_ybt", "ybt_complete_pipeline", "ybt_complete_analysis", "ybt_imu_audit", "build_complete_deliverables"]
